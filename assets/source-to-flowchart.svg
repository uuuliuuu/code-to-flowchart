<text x="960" y="505" font-family="Arial, sans-serif" font-size="18" fill="#203048" text-anchor="start" dominant-baseline="central">No</text>
<polygon points="940,528.0 1080.0,605 940,682.0 800.0,605" fill="#fff2cf" stroke="#c7b982" stroke-width="2"/>
<text x="940" y="592.0" font-family="Arial, sans-serif" font-size="20" fill="#203048" text-anchor="middle" dominant-baseline="central">member OR</text>
<text x="940" y="618.0" font-family="Arial, sans-serif" font-size="20" fill="#203048" text-anchor="middle" dominant-baseline="central">total &gt;= 100?</text>
<polyline points="1080,605 1170,605" fill="none" stroke="#506782" stroke-width="3"/>
<polygon points="1170,605 1158.0,600.0 1158.0,610.0" fill="#506782"/>
<text x="1123" y="583" font-family="Arial, sans-serif" font-size="18" fill="#203048" text-anchor="middle" dominant-baseline="central">Yes</text>
<rect x="1170.0" y="574.0" width="190" height="62" rx="22" fill="#e0f3ed" stroke="#93c1b5" stroke-width="2"/>
<text x="1265" y="605.0" font-family="Arial, sans-serif" font-size="20" fill="#203048" text-anchor="middle" dominant-baseline="central">Return 0</text>
<polyline points="940,682 940,754" fill="none" stroke="#506782" stroke-width="3"/>
<polygon points="940,754 945.0,742.0 935.0,742.0" fill="#506782"/>
<text x="960" y="719" font-family="Arial, sans-serif" font-size="18" fill="#203048" text-anchor="start" dominant-baseline="central">No</text>
<rect x="840.0" y="754.0" width="200" height="62" rx="22" fill="#e0f3ed" stroke="#93c1b5" stroke-width="2"/>
<text x="940" y="785.0" font-family="Arial, sans-serif" font-size="20" fill="#203048" text-anchor="middle" dominant-baseline="central">Return 8</text>
